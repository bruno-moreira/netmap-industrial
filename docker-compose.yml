# NetMap Industrial — Docker Compose
#
# Subir tudo (na raiz do repositório):
#   docker compose up --build
#
# Apenas banco + API:
#   docker compose up --build db api

name: netmap-industrial

services:
  db:
    image: postgres:16-alpine
    container_name: netmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-netmap}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-netmap}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netmap-api
    restart: unless-stopped
    ports:
      - '${PORT:-3002}:${PORT:-3002}'
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3002}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-netmap}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:${PORT:-3002}/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netmap-frontend
    restart: unless-stopped
    ports:
      - '${VITE_PORT:-5173}:5173'
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${PORT:-3002}/api}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    name: netmap-pgdata

networks:
  default:
    name: netmap-network
