zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 10000000000040008000000000000001
      name: Templates/Network devices
  templates:
    - uuid: 10000000000040008000000000000002
      template: 'HPE Instant On 1930 SNMP v2'
      name: 'HPE Instant On 1930 SNMP v2'
      description: |
        Template avançado para HPE Networking Instant On 1930 48p (JL686A).
        
        Monitoramento focado em:
        - Ping (Status, Latência e Loss)
        - CPU do Sistema (com Gráfico)
        - Mapeamento e Status das portas (Up/Down)
        - Tráfego das portas (Download/Upload em bps com Gráficos)
        - Mapeamento de VLAN da porta (PVID)
        - Descoberta de vizinhos via LLDP
      groups:
        - name: Templates/Network devices
      items:
        - uuid: 10000000000040008000000000000101
          name: 'Sistema: Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 1m
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: Status
        - uuid: 10000000000040008000000000000102
          name: 'ICMP: Ping status'
          type: SIMPLE
          key: icmpping
          delay: 1m
          value_type: FLOAT
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Ping
        - uuid: 10000000000040008000000000000103
          name: 'ICMP: Ping tempo de resposta'
          type: SIMPLE
          key: icmppingsec
          delay: 1m
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Ping
        - uuid: 10000000000040008000000000000104
          name: 'ICMP: Ping perda de pacotes'
          type: SIMPLE
          key: icmppingloss
          delay: 1m
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Ping
        - uuid: 10000000000040008000000000000105
          name: 'Sistema: Uso de CPU (1 min)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.11.2.1.8.0
          key: system.cpu.util
          delay: 1m
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: CPU
      discovery_rules:
        - uuid: 10000000000040008000000000000201
          name: 'Descoberta de Interfaces'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2]'
          key: net.if.discovery
          delay: 1h
          item_prototypes:
            - uuid: 10000000000040008000000000000301
              name: 'Porta {#IFNAME}: Status Operacional'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[{#IFNAME}]'
              delay: 3m
              value_type: FLOAT
              valuemap:
                name: 'IF-MIB endpoint'
              tags:
                - tag: Application
                  value: Interfaces
            - uuid: 10000000000040008000000000000302
              name: 'Porta {#IFNAME}: VLAN ID (PVID)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.17.7.1.4.5.1.1.{#SNMPINDEX}'
              key: 'net.if.vlan[{#IFNAME}]'
              delay: 1h
              value_type: FLOAT
              tags:
                - tag: Application
                  value: VLANs
            - uuid: 10000000000040008000000000000303
              name: 'Porta {#IFNAME}: Tráfego de Entrada (Download)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[{#IFNAME}]'
              delay: 3m
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Tráfego
            - uuid: 10000000000040008000000000000304
              name: 'Porta {#IFNAME}: Tráfego de Saída (Upload)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[{#IFNAME}]'
              delay: 3m
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Tráfego
          graph_prototypes:
            - uuid: 10000000000040008000000000000401
              name: 'Tráfego de Rede: Porta {#IFNAME}'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'HPE Instant On 1930 SNMP v2'
                    key: 'net.if.in[{#IFNAME}]'
                - sortorder: '1'
                  color: 2774A4
                  item:
                    host: 'HPE Instant On 1930 SNMP v2'
                    key: 'net.if.out[{#IFNAME}]'
        - uuid: 10000000000040008000000000000202
          name: 'Descoberta de Vizinhos LLDP'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#LLDP_REMOTE_SYSNAME},1.0.8802.1.1.2.1.4.1.1.9]'
          key: lldp.neighbor.discovery
          delay: 1h
          item_prototypes:
            - uuid: 10000000000040008000000000000305
              name: 'LLDP ({#SNMPINDEX}): Dispositivo Conectado'
              type: SNMP_AGENT
              snmp_oid: '1.0.8802.1.1.2.1.4.1.1.9.{#SNMPINDEX}'
              key: 'lldp.neighbor.name[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: Application
                  value: LLDP
            - uuid: 10000000000040008000000000000306
              name: 'LLDP ({#SNMPINDEX}): Porta do Dispositivo Conectado'
              type: SNMP_AGENT
              snmp_oid: '1.0.8802.1.1.2.1.4.1.1.7.{#SNMPINDEX}'
              key: 'lldp.neighbor.port[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: Application
                  value: LLDP
      valuemaps:
        - uuid: 10000000000040008000000000000601
          name: 'IF-MIB endpoint'
          mappings:
            - value: '1'
              newvalue: 'Up (Conectada)'
            - value: '2'
              newvalue: 'Down (Desconectada)'
            - value: '3'
              newvalue: 'Testing'
            - value: '4'
              newvalue: 'Unknown'
            - value: '5'
              newvalue: 'Dormant'
            - value: '6'
              newvalue: 'Not Present'
            - value: '7'
              newvalue: 'Lower Layer Down'
        - uuid: 10000000000040008000000000000602
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: 'Down'
            - value: '1'
              newvalue: 'Up'
  graphs:
    - uuid: 10000000000040008000000000000501
      name: 'Sistema: Uso de CPU'
      graph_items:
        - color: 1A7C11
          item:
            host: 'HPE Instant On 1930 SNMP v2'
            key: system.cpu.util